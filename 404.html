<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-wrapper');
          if (btnContainer) btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main>
    <div class="bg-wide" data-background-image="/icons/error-bg-shape.svg">
      <div class="columns error-page notfound">
        <div>
          <div>
            <picture><img alt="" src="/icons/error-question-mark.svg" width="177" height="169"></picture>
          </div>
          <div>
            <h1 id="sorrywe-couldnt-find-what-youre-looking-for">Sorry—we couldn't find what you're looking for</h1>
            <p>This page may have been removed or updated.</p>
            <p><em><strong><a href="/">Return to home page</a></strong></em></p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>

</html>
